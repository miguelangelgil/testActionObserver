name: Workflow Status Notifier

on:
  workflow_run:
    workflows: [" miguelangelgil/testWORKFLOW/.github/workflows/main.yml@main"]
    types:
      - completed

jobs:
    notify:
        name: notify
        runs-on: ubuntu-latest
        steps:
        - name: notify
          run: echo "🔔 *Workflow:* ${{ github.workflow }} \n📜 *Estado:* ${{ github.event.workflow_run.conclusion }} \n📌 *Ejecutado en:* ${{ github.event.workflow_run.head_branch }} \n🔗 *Detalles:* ${{ github.event.workflow_run.html_url }}"
